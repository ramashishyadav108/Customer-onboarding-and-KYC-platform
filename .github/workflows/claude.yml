name: claude-review
# Manual only: nothing runs on push or pull request, so cloning this project and pushing it to another
# repository starts no CI. Run it on demand from the Actions tab (needs the ANTHROPIC_API_KEY secret).
on:
  workflow_dispatch:
jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >
            Review this pull request against specs/*_spec.md and CLAUDE.md: layering, append-only rules,
            integer-only scoring, no plaintext PII in logs, AC-NN test tags.
